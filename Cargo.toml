[workspace]
resolver = "3"
members = [
    "crates/demarcate",
    "crates/demarcate-connection",
    "crates/demarcate-core",
    "crates/demarcate-interceptor",
    "crates/demarcate-macros",
    "crates/demarcate-sqlx",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/HarryJhin/demarcate"

[workspace.dependencies]
tokio = { version = "1.38", features = ["rt", "sync", "macros", "time"] }
tracing = "0.1.37"
sqlx = { version = "0.9.1", default-features = false }
