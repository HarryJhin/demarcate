[workspace]
resolver = "3"
members = ["crates/dtx-core", "crates/dtx-datasource", "crates/dtx-sqlx"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
tracing = "0.1"
sqlx = { version = "0.9", default-features = false }
