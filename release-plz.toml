[workspace]
# Versions come from git tags. Nothing is published to crates.io.
git_only = true
# Release only when a release pull request is merged.
release_always = false
dependencies_update = false
# One tag, one GitHub release and one changelog for the workspace: see the `demarcate` package.
git_tag_name = "v{{ version }}"
git_tag_enable = false
git_release_enable = false
changelog_update = false

[[package]]
name = "demarcate"
git_tag_enable = true
git_release_enable = true
git_release_name = "v{{ version }}"
changelog_update = true
changelog_path = "./CHANGELOG.md"
changelog_include = ["demarcate-connection", "demarcate-core", "demarcate-diesel-async", "demarcate-interceptor", "demarcate-macros", "demarcate-sea-orm", "demarcate-sqlx", "demarcate-tokio-postgres"]

# release-plz reads every package from the commit of its latest release tag, and fails when the
# package does not exist there. A package that is newer than the latest tag needs an entry of
# its own with a tag name that matches no tag, so release-plz treats it as an initial release:
#
#   [[package]]
#   name = "demarcate-new"
#   git_tag_name = "demarcate-new-v{{ version }}"
#
# After the first release that contains the package, delete the entry and add the package to
# `changelog_include`.
