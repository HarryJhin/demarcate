[workspace]
# Versions come from git tags. Nothing is published to crates.io.
git_only = true
# Release only when a release pull request is merged.
release_always = false
dependencies_update = false
# One tag, one GitHub release and one changelog for the workspace: see the `demarcate` package.
git_tag_name = "v{{ version }}"
git_tag_enable = false
git_release_enable = false
changelog_update = false

[[package]]
name = "demarcate"
git_tag_enable = true
git_release_enable = true
git_release_name = "v{{ version }}"
changelog_update = true
changelog_path = "./CHANGELOG.md"
changelog_include = ["demarcate-core", "demarcate-interceptor", "demarcate-macros", "demarcate-sqlx"]

# release-plz reads every package from the commit of its latest release tag, and fails when the
# package does not exist there. A package that is newer than the latest tag needs a tag name that
# matches no tag, so release-plz treats it as an initial release. Move the package into
# `changelog_include` and delete its entry after the first release that contains it.
[[package]]
name = "demarcate-connection"
git_tag_name = "demarcate-connection-v{{ version }}"

[[package]]
name = "demarcate-diesel-async"
git_tag_name = "demarcate-diesel-async-v{{ version }}"

[[package]]
name = "demarcate-sea-orm"
git_tag_name = "demarcate-sea-orm-v{{ version }}"

[[package]]
name = "demarcate-tokio-postgres"
git_tag_name = "demarcate-tokio-postgres-v{{ version }}"
