name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, "1.94"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: demarcate
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: demarcate
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DEMARCATE_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
      DEMARCATE_TEST_MYSQL_URL: mysql://root:test@localhost:3306/demarcate
      DEMARCATE_TEST_MARIADB_URL: mysql://root:test@localhost:3307/demarcate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: cargo fmt --all --check
        if: matrix.toolchain == 'stable'
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        if: matrix.toolchain == 'stable'
      - run: cargo test --workspace -- --include-ignored
      - run: cargo test --workspace --all-features --no-run
      - name: build the sqlx driver with one database at a time
        run: |
          cargo check -p demarcate-sqlx --no-default-features --features postgres
          cargo check -p demarcate-sqlx --no-default-features --features mysql
          cargo check -p demarcate-sqlx --no-default-features --features sqlite
      - name: lint and test the axum-orders example
        run: |
          cargo clippy --manifest-path examples/axum-orders/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path examples/axum-orders/Cargo.toml -- --include-ignored
      - name: build the quickstart example outside the workspace without sqlx default features
        run: cargo clippy --manifest-path examples/quickstart/Cargo.toml -- -D warnings
      - name: build and run the quickstart example with sqlx default features
        run: cargo run --manifest-path examples/quickstart/Cargo.toml --features sqlx-default
        env:
          DATABASE_URL: ${{ env.DEMARCATE_TEST_DATABASE_URL }}
      - run: cargo doc --workspace --no-deps --all-features
        if: matrix.toolchain == 'stable'
        env:
          RUSTDOCFLAGS: -D warnings

  minimal-versions:
    name: lowest declared dependency versions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: demarcate
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: demarcate
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DEMARCATE_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
      DEMARCATE_TEST_MYSQL_URL: mysql://root:test@localhost:3306/demarcate
      DEMARCATE_TEST_MARIADB_URL: mysql://root:test@localhost:3307/demarcate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.94"
      - name: resolve every direct dependency to the lowest version that its requirement allows
        run: cargo +nightly update -Z direct-minimal-versions
      - run: cargo +1.94 test --workspace --all-features -- --include-ignored
