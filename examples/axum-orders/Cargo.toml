[package]
name = "demarcate-example-axum-orders"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
# In your own project, use the dependency line of the README of the repository.
demarcate = { path = "../../crates/demarcate", features = ["sqlx-postgres"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tower = { version = "0.5", features = ["limit"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
