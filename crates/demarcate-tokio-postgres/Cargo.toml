[package]
name = "demarcate-tokio-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "tokio-postgres transaction manager for demarcate, on a deadpool-postgres pool"
keywords = ["transaction", "database", "spring", "async", "postgres"]
categories = ["database", "asynchronous"]

[dependencies]
demarcate-connection = { path = "../demarcate-connection", version = "0.2.2" }
demarcate-core = { path = "../demarcate-core", version = "0.2.2", default-features = false }
deadpool-postgres = "0.14.1"
tokio-postgres = "0.7.13"
