[package]
name = "demarcate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Declarative transactions for Rust, ported from Spring: #[transactional], propagation, rollback rules and transaction synchronization"
keywords = ["transaction", "database", "spring", "async", "sqlx"]
categories = ["database", "asynchronous"]

[features]
default = []
sqlx-postgres = ["dep:demarcate-sqlx", "demarcate-sqlx/postgres"]
sqlx-mysql = ["dep:demarcate-sqlx", "demarcate-sqlx/mysql"]
sqlx-sqlite = ["dep:demarcate-sqlx", "demarcate-sqlx/sqlite"]
sea-orm = ["dep:demarcate-sea-orm"]
diesel-async-postgres = ["dep:demarcate-diesel-async", "demarcate-diesel-async/postgres"]
diesel-async-mysql = ["dep:demarcate-diesel-async", "demarcate-diesel-async/mysql"]
tokio-postgres = ["dep:demarcate-tokio-postgres"]

[dependencies]
demarcate-connection = { path = "../demarcate-connection", version = "0.2.0" }
demarcate-core = { path = "../demarcate-core", version = "0.2.0" }
demarcate-diesel-async = { path = "../demarcate-diesel-async", version = "0.2.0", optional = true, default-features = false }
demarcate-interceptor = { path = "../demarcate-interceptor", version = "0.2.0" }
demarcate-macros = { path = "../demarcate-macros", version = "0.2.0" }
demarcate-sea-orm = { path = "../demarcate-sea-orm", version = "0.2.0", optional = true }
demarcate-sqlx = { path = "../demarcate-sqlx", version = "0.2.0", optional = true, default-features = false }
demarcate-tokio-postgres = { path = "../demarcate-tokio-postgres", version = "0.2.0", optional = true }

[dev-dependencies]
demarcate = { path = ".", features = ["sqlx-postgres", "sqlx-mysql", "sqlx-sqlite", "sea-orm", "tokio-postgres", "diesel-async-postgres", "diesel-async-mysql"] }
futures-util = "0.3.32"
deadpool-postgres = "0.14.1"
diesel = { version = "2.4.0", default-features = false }
diesel-async = { version = "0.10.0", default-features = false, features = ["deadpool", "postgres", "mysql"] }
sea-orm = { version = "2.0.4", default-features = false, features = ["runtime-tokio", "sqlx-postgres", "sqlx-mysql", "sqlx-sqlite", "macros"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "mysql", "sqlite"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time"] }
tokio-postgres = "0.7.13"
