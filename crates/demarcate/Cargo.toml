[package]
name = "demarcate"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
sqlx-postgres = ["dep:demarcate-sqlx", "demarcate-sqlx/postgres"]
sqlx-macros = ["demarcate-sqlx?/macros"]

[dependencies]
demarcate-core = { path = "../demarcate-core" }
demarcate-interceptor = { path = "../demarcate-interceptor" }
demarcate-macros = { path = "../demarcate-macros" }
demarcate-sqlx = { path = "../demarcate-sqlx", optional = true, default-features = false }

[dev-dependencies]
demarcate = { path = ".", features = ["sqlx-postgres"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
