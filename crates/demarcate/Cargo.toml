[package]
name = "demarcate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Declarative transactions for Rust, ported from Spring: #[transactional], propagation, rollback rules and transaction synchronization"
keywords = ["transaction", "database", "spring", "async", "sqlx"]
categories = ["database", "asynchronous"]

[features]
default = []
sqlx-postgres = ["dep:demarcate-sqlx", "demarcate-sqlx/postgres"]
sqlx-mysql = ["dep:demarcate-sqlx", "demarcate-sqlx/mysql"]
sqlx-sqlite = ["dep:demarcate-sqlx", "demarcate-sqlx/sqlite"]
sea-orm = ["dep:demarcate-sea-orm"]

[dependencies]
demarcate-connection = { path = "../demarcate-connection", version = "0.1.0" }
demarcate-core = { path = "../demarcate-core", version = "0.1.0" }
demarcate-interceptor = { path = "../demarcate-interceptor", version = "0.1.0" }
demarcate-macros = { path = "../demarcate-macros", version = "0.1.0" }
demarcate-sea-orm = { path = "../demarcate-sea-orm", version = "0.1.0", optional = true }
demarcate-sqlx = { path = "../demarcate-sqlx", version = "0.1.0", optional = true, default-features = false }

[dev-dependencies]
demarcate = { path = ".", features = ["sqlx-postgres", "sqlx-mysql", "sqlx-sqlite", "sea-orm"] }
futures-util = "0.3.32"
sea-orm = { version = "2.0.4", default-features = false, features = ["runtime-tokio", "sqlx-postgres", "sqlx-mysql", "sqlx-sqlite", "macros"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "mysql", "sqlite"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time"] }
