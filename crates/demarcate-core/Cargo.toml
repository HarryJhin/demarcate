[package]
name = "demarcate-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Transaction abstraction for declarative transactions: propagation, synchronization and the transaction manager core"
keywords = ["transaction", "database", "spring", "async", "sqlx"]
categories = ["database", "asynchronous"]

[features]
default = ["tokio"]
tokio = ["dep:tokio"]

[dependencies]
tokio = { workspace = true, optional = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
