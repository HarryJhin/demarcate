[package]
name = "demarcate-sqlx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "sqlx transaction manager for demarcate: PostgreSQL driver and a transaction-aware pool"
keywords = ["transaction", "database", "spring", "async", "sqlx"]
categories = ["database", "asynchronous"]

[features]
default = ["postgres"]
postgres = ["sqlx/postgres"]
macros = ["sqlx/macros"]

[dependencies]
demarcate-core = { path = "../demarcate-core", version = "0.1.0" }
async-stream = "0.3"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
