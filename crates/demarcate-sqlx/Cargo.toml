[package]
name = "demarcate-sqlx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "sqlx transaction manager for demarcate: PostgreSQL driver and a transaction-aware pool"
keywords = ["transaction", "database", "spring", "async", "sqlx"]
categories = ["database", "asynchronous"]

[features]
default = ["postgres"]
postgres = [
    "dep:async-stream",
    "dep:demarcate-core",
    "dep:futures-core",
    "dep:futures-util",
    "dep:sqlx",
    "dep:tokio",
    "dep:tracing",
    "sqlx/postgres",
    "sqlx/macros",
]

[dependencies]
demarcate-core = { path = "../demarcate-core", version = "0.1.0", optional = true }
async-stream = { version = "0.3.6", optional = true }
futures-core = { version = "0.3.32", optional = true }
futures-util = { version = "0.3.32", default-features = false, features = ["alloc"], optional = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time"] }
